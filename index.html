<!doctype html>
<html lang="ar-EG" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClinicFlow AI | كلينيك فلو — إدارة أذكى للعيادات وتجربة أسهل للمرضى</title>
    <meta
      name="description"
      content="منصة ذكية لتنظيم مواعيد العيادات الطبية، وتقليل الانتظار، وتسهيل الوصول إلى الرعاية الصحية باللغتين العربية والإنجليزية."
    />
    <meta property="og:title" content="ClinicFlow AI | كلينيك فلو" />
    <meta
      property="og:description"
      content="إدارة أذكى للعيادات.. وتجربة أسهل للمرضى"
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var lang = localStorage.getItem('clinicflow_lang') || 'ar-EG';
          var isAr = lang.startsWith('ar');
          document.documentElement.lang = isAr ? 'ar-EG' : 'en';
          document.documentElement.dir = isAr ? 'rtl' : 'ltr';
          var theme = localStorage.getItem('clinicflow_theme');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F6F9FC] text-[#14283F] dark:bg-slate-950 dark:text-slate-100 antialiased selection:bg-[#087F8C]/20 selection:text-[#087F8C]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
